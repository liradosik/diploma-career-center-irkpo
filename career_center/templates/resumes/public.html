{% extends 'base_public.html' %}
{% block content %}<div class='card'><h1>{{ student.full_name }}</h1><p style='color:#2566de'>{{ resume.title }}</p><p>{{ resume.about|default:profile.about }}</p></div>
<div class='card' style='margin-top:20px'><h2>Достижения</h2>{% for e in entries %}<div class='list-item'><h3>{{ e.title }}</h3><p>{{ e.description }}</p></div>{% empty %}<p>Нет данных.</p>{% endfor %}</div>{% endblock %}
